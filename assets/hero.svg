<svg xmlns="http://www.w3.org/2000/svg" width="840" height="240" viewBox="0 0 840 240" role="img" aria-label="Ayaz">
<title>Ayaz</title><style>
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.spinr{transform-box:fill-box;transform-origin:center;animation:spin 28s linear infinite reverse}
.bob{transform-box:fill-box;transform-origin:center;animation:bob 7s ease-in-out infinite}
.up{animation:up .8s cubic-bezier(.05,.7,.1,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(12deg)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<clipPath id="card"><rect width="840" height="240" rx="36"/></clipPath>
<clipPath id="ava"><rect x="120" y="42" width="156" height="156" rx="54"/></clipPath>
<rect x=".5" y=".5" width="839" height="239" rx="36" fill="#000" stroke="#2a2a2a"/>
<g clip-path="url(#card)">
<rect class="spin" x="760" y="-40" width="120" height="120" rx="34" fill="#141414"/>
<circle class="bob" cx="780" cy="226" r="30" fill="#1a1a1a"/>
<rect class="spinr" x="30" y="170" width="60" height="60" rx="20" fill="#101010"/>
</g>
<g class="pop">
<image href="data:image/jpeg;base64," x="120" y="42" width="156" height="156" clip-path="url(#ava)" preserveAspectRatio="xMidYMid slice"/>
<rect x="120.5" y="42.5" width="155" height="155" rx="53.5" fill="none" stroke="#333"/>
</g>
<g class="up">
<text x="540" y="108" text-anchor="middle" fill="#fff" font-family="'Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" style="font-size:58px;font-weight:800;letter-spacing:22px">AYAZ</text>
<text x="540" y="146" text-anchor="middle" fill="#9a9a9a" font-family="'Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" style="font-size:21px;font-weight:500">Developer &amp; digital creator</text>
</g>
<g class="up" style="animation-delay:.2s">
<rect x="428" y="164" width="108" height="34" rx="17" fill="#161616" stroke="#2a2a2a"/>
<text x="482" y="186" text-anchor="middle" fill="#fff" font-family="'Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" style="font-size:15px;font-weight:600">Pakistan</text>
<rect x="546" y="164" width="140" height="34" rx="17" fill="#161616" stroke="#2a2a2a"/>
<text x="616" y="186" text-anchor="middle" fill="#fff" font-family="'Google Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif" style="font-size:15px;font-weight:600">@ayazaliofc</text>
</g>
</svg>